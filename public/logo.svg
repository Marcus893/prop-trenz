<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- House with roof -->
  <g>
    <!-- Roof (triangle) -->
    <path d="M15 20 L25 12 L35 20 Z" fill="#2563EB"/>
    <!-- House body -->
    <rect x="18" y="20" width="14" height="18" fill="#2563EB" rx="1"/>
    <!-- Door -->
    <rect x="22" y="28" width="6" height="10" fill="#FFFFFF" opacity="0.9" rx="0.5"/>
    <!-- Window -->
    <rect x="26" y="22" width="4" height="4" fill="#FFFFFF" opacity="0.9" rx="0.5"/>
    
    <!-- Second house (smaller, behind) -->
    <path d="M5 26 L12 20 L19 26 Z" fill="#3B82F6" opacity="0.8"/>
    <rect x="7" y="26" width="10" height="12" fill="#3B82F6" opacity="0.8" rx="1"/>
    
    <!-- Third house (taller, right) -->
    <path d="M38 18 L46 10 L54 18 Z" fill="#1E40AF"/>
    <rect x="42" y="18" width="10" height="20" fill="#1E40AF" rx="1"/>
    <rect x="45" y="26" width="4" height="12" fill="#FFFFFF" opacity="0.9" rx="0.5"/>
  </g>
  
  <!-- Upward trend line with data points -->
  <g>
    <path d="M8 40 L22 35 L35 28 L48 22" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="8" cy="40" r="2.5" fill="#10B981"/>
    <circle cx="22" cy="35" r="2.5" fill="#10B981"/>
    <circle cx="35" cy="28" r="2.5" fill="#10B981"/>
    <circle cx="48" cy="22" r="2.5" fill="#10B981"/>
  </g>
  
  <!-- Text: PropTrenz -->
  <text x="58" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#1F2937" letter-spacing="-0.5">
    PropTrenz
  </text>
  
  <!-- Subtle accent line -->
  <line x1="58" y1="38" x2="180" y2="38" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
